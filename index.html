<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Happy Holi</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
    *{
        margin:0;
        padding:0;
        box-sizing:border-box;
        font-family: 'Segoe UI', sans-serif;
    }

    body{
        height:100vh;
        display:flex;
        justify-content:center;
        align-items:center;
        background: linear-gradient(135deg, #ffc0cb, #ffd6e8, #ffe6f2);
        overflow:hidden;
        position:relative;
    }

    /* === Soft Color Throws Background === */

    body::before,
    body::after{
        content:"";
        position:absolute;
        width:400px;
        height:400px;
        border-radius:50%;
        filter:blur(80px);
        opacity:0.35;
        animation: floatColors 10s ease-in-out infinite alternate;
    }

    body::before{
        background: radial-gradient(circle, #ff1744, #ff9100);
        top:-100px;
        left:-100px;
    }

    body::after{
        background: radial-gradient(circle, #2979ff, #00c853);
        bottom:-100px;
        right:-100px;
        animation-delay:5s;
    }

    @keyframes floatColors{
        0%{
            transform: translate(0,0) scale(1);
        }
        100%{
            transform: translate(60px,40px) scale(1.2);
        }
    }

    /* === Glass Card === */

    .glass{
        width:85%;
        max-width:500px;
        padding:40px;
        text-align:center;
        border-radius:25px;

        background: rgba(255, 255, 255, 0.25);
        backdrop-filter: blur(15px);
        -webkit-backdrop-filter: blur(15px);

        border:1px solid rgba(255,255,255,0.4);
        box-shadow: 0 8px 32px rgba(0,0,0,0.2);

        opacity:0;
        transform:scale(0.9);
        transition: all 1.2s ease;
        z-index:2;
    }

    /* Show animation */
    .glass.show{
        opacity:1;
        transform:scale(1);
    }

    /* === Text Styling === */

    h1{
        font-size:48px;
        font-weight:bold;
        color:#d81b60;
        text-shadow: 2px 2px 8px rgba(0,0,0,0.15);
    }

    .english{
        margin-top:20px;
        font-size:18px;
        color:#0d47a1;
        font-weight:500;
    }

    .hindi{
        margin-top:15px;
        font-size:18px;
        color:#6a1b9a;
        font-weight:600;
    }
    </style>

</head>
<body>

    <div class="glass" id="glassCard">
        <h1>🌈 Happy Holi 🌸</h1>

        <p class="english">
            May this festival of colors fill your life with happiness,
            positivity, and endless joy.
        </p>

        <p class="hindi">
            यह रंगों का त्योहार आपके जीवन में सुख, शांति और समृद्धि लेकर आए।
        </p>
    </div>

    <script>
    document.addEventListener("DOMContentLoaded", function() {

        const card = document.getElementById("glassCard");

        // Smooth appearance after small delay
        setTimeout(function(){
            card.classList.add("show");
        }, 500);

    });
    </script>

</body>
</html>
